name: security

# Pipeline de seguridad (SAST + secretos + lint).
# Corre en cada Pull Request y en cada push a main.
# El deploy NO ocurre aquí: lo hace AWS Amplify al conectar la rama main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo para que gitleaks revise todos los commits del PR.
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Ejecutar gitleaks
        # Falla el job (exit code != 0) si encuentra cualquier secreto.
        run: gitleaks detect --source . --no-banner --redact --verbose

  sast:
    name: SAST (SonarQube Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube necesita el historial completo para el análisis de PRs.
          fetch-depth: 0
      # Acción oficial de SonarSource. La antigua sonarcloud-github-action está
      # descontinuada. (v5 es la usada en este demo; existen majors más nuevos.)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          # SONAR_TOKEN: secret del repo (Settings → Secrets and variables → Actions).
          # No se necesita SONAR_HOST_URL para SonarQube Cloud.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Quality Gate bloqueante: el job falla si el Quality Gate no pasa.
          args: >
            -Dsonar.qualitygate.wait=true
