name: security

# Pipeline de seguridad (lint + escaneo de secretos).
# Corre en cada Pull Request y en cada push a main.
# El deploy NO ocurre aquí: lo hace AWS Amplify al conectar la rama main.
#
# SAST: lo aporta SonarQube Cloud mediante "Automatic Analysis" (la app de
# SonarCloud conectada al repo), que publica el check "SonarCloud Code Analysis"
# en cada PR. Por eso aquí NO incluimos un job de SonarScanner: Automatic
# Analysis y el scanner basado en CI no pueden coexistir en el mismo proyecto.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo para que gitleaks revise todos los commits del PR.
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Ejecutar gitleaks
        # Falla el job (exit code != 0) si encuentra cualquier secreto.
        #
        # En un Pull Request escaneamos SOLO los commits que el PR agrega
        # (rango base..HEAD), no todo el historial del repo. Así un PR limpio no
        # se ve tumbado por secretos que ya vivían en otros commits/ramas del
        # repositorio (p. ej. la rama demo insegura). Los secretos NUEVOS del PR
        # sí se detectan y bloquean.
        #
        # En push a main escaneamos el árbol completo (defensa en profundidad).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR: escaneando solo el rango ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            gitleaks detect --source . --no-banner --redact --verbose \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            echo "push a ${{ github.ref_name }}: escaneo completo del repositorio"
            gitleaks detect --source . --no-banner --redact --verbose
          fi
