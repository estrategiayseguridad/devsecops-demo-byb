# Cabeceras HTTP de seguridad para AWS Amplify Hosting.
#
# ESTE ARCHIVO ES EL FIX DE LA MISCONFIGURATION (OWASP A05 / Security
# Misconfiguration). En la rama de demostración este archivo NO existe, por lo
# que el sitio se sirve SIN cabeceras de seguridad. En main, Amplify aplica
# estas cabeceras a todo el sitio.
#
# Referencia: https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
customHeaders:
  - pattern: "**"
    headers:
      # Content-Security-Policy básica para un sitio estático sin recursos
      # externos. 'self' cubre los bundles JS y CSS que genera Vite.
      # (No hay scripts inline, así que no se necesita 'unsafe-inline' en script-src.)
      - key: "Content-Security-Policy"
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none';
          form-action 'self';
          upgrade-insecure-requests
      # Evita el MIME sniffing.
      - key: "X-Content-Type-Options"
        value: "nosniff"
      # Defensa anti-clickjacking (complementa frame-ancestors 'none').
      - key: "X-Frame-Options"
        value: "DENY"
      # No filtrar la URL completa como referer a otros orígenes.
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      # Fuerza HTTPS en visitas futuras.
      - key: "Strict-Transport-Security"
        value: "max-age=63072000; includeSubDomains; preload"
      # Desactiva APIs sensibles del navegador que el sitio no usa.
      - key: "Permissions-Policy"
        value: "geolocation=(), microphone=(), camera=()"
