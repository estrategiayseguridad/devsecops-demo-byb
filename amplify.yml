# Build spec de AWS Amplify Hosting.
# Amplify ejecuta este build al detectar un push a la rama conectada (main).
# La salida estática de Vite (dist/) es lo que se publica en el CDN.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # baseDirectory: carpeta con el sitio ya construido.
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
