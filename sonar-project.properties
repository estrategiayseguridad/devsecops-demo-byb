# Configuración de SonarQube Cloud.
#
# PLACEHOLDERS: reemplaza estos dos valores con los de TU proyecto en
# SonarQube Cloud (https://sonarcloud.io). En un repo PÚBLICO el análisis
# es gratuito.
sonar.organization=CHANGE_ME-org
sonar.projectKey=CHANGE_ME-project-key

# Nombre visible del proyecto (opcional).
sonar.projectName=Portal de Proveedores — Demo

# Qué analizar y qué excluir.
sonar.sources=src
sonar.exclusions=dist/**,node_modules/**,**/*.config.*

# Codificación del código fuente.
sonar.sourceEncoding=UTF-8
