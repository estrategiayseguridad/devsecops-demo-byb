# Configuración de SonarQube Cloud.
#
# Este proyecto usa "Automatic Analysis" (la app de SonarCloud conectada al
# repo), que toma estos valores de su propia configuración. El archivo se deja
# por claridad y porque Automatic Analysis respeta sources/exclusions si existe.
# En un repo PÚBLICO el análisis es gratuito.
sonar.organization=estrategiayseguridad
sonar.projectKey=estrategiayseguridad_devsecops-demo-byb

# Nombre visible del proyecto (opcional).
sonar.projectName=Portal de Proveedores — Demo

# Qué analizar y qué excluir.
sonar.sources=src
sonar.exclusions=dist/**,node_modules/**,**/*.config.*

# Codificación del código fuente.
sonar.sourceEncoding=UTF-8
